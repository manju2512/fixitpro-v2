spring:
  application:
    name: ai-chat-service

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}   # must match core-service's signing key - this service only verifies, never issues
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  core-service:
    base-url: ${CORE_SERVICE_URL:http://core-service:8080}
  ai:
    groq-api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}

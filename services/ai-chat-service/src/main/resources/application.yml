spring:
  application:
    name: ai-chat-service

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents

app:
  jwt:
    secret: ${JWT_SECRET}   # must match core-service's signing key - this service only verifies, never issues
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  core-service:
    base-url: ${CORE_SERVICE_URL:http://core-service:8080}
  ai:
    groq-api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
  rate-limit:
    chat:
      capacity: ${CHAT_RATE_LIMIT_CAPACITY:15}
      refill-minutes: ${CHAT_RATE_LIMIT_REFILL_MIN:5}

resilience4j:
  circuitbreaker:
    instances:
      groq:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-state-enabled: true
  timelimiter:
    instances:
      groq:
        timeout-duration: 45s
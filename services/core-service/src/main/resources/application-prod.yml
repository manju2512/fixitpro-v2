spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # Upstash and most managed free-tier Redis require TLS - set REDIS_SSL=true on Render

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.fixitpro: INFO

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

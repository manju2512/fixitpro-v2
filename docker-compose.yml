services:
  mysql:
    image: mysql:8.0
    container_name: fixitpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass_local_only}
      MYSQL_DATABASE: ${DB_NAME:-fixitpro}
      MYSQL_USER: ${DB_USER:-fixitpro_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: fixitpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: fixitpro-core-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fixitpro}
      DB_USER: ${DB_USER:-fixitpro_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_RATE_LIMIT_CAPACITY: ${AUTH_RATE_LIMIT_CAPACITY:-5}
      AUTH_RATE_LIMIT_REFILL_MIN: ${AUTH_RATE_LIMIT_REFILL_MIN:-1}
    ports:
      - "8080:8080"
    init: true

  ai-chat-service:
    build:
      context: ./services/ai-chat-service
      dockerfile: Dockerfile
    container_name: fixitpro-ai-chat-service
    restart: unless-stopped
    depends_on:
      - core-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORE_SERVICE_URL: http://core-service:8080
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8081:8081"
    init: true

volumes:
  mysql_data:
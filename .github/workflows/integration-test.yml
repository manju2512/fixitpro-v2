name: Integration Test

# There are no unit tests in either backend service yet (see backend-ci.yml)
# so this workflow is currently the only thing that verifies actual
# *behavior* rather than just "does it compile". It runs the same
# test_fixitpro_flow.ps1, test_ai_chat_flow.ps1, and test-everything.ps1
# scripts used for manual verification throughout development, against a
# real docker-compose stack (MySQL + Redis + core-service + ai-chat-service),
# on GitHub's own runner. `pwsh` (PowerShell Core) ships preinstalled on
# ubuntu-latest, and the scripts only call localhost - since the runner IS
# the Docker host, that works identically to running them locally.
#
# test-everything.ps1 now also runs the frontend's typecheck/lint/build as
# part of its own suite, so Node needs to be available on this runner too
# (see "Set up Node.js" below) - not just for docker-compose's Java services.
#
# Requires a GROQ_API_KEY repository secret (Settings > Secrets and
# variables > Actions) for the AI chat portion - get a free key at
# https://console.groq.com. Without it, test_ai_chat_flow.ps1 will correctly
# fail fast (the assistant reports it isn't configured) rather than silently
# skipping the AI checks.

on:
  push:
    branches: [main, develop]
    paths:
      - "services/core-service/**"
      - "services/ai-chat-service/**"
      - "frontend/**"
      - "test_fixitpro_flow.ps1"
      - "test_ai_chat_flow.ps1"
      - "test-everything.ps1"
      - "docker-compose.yml"
      - ".github/workflows/integration-test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/core-service/**"
      - "services/ai-chat-service/**"
      - "frontend/**"
      - "test_fixitpro_flow.ps1"
      - "test_ai_chat_flow.ps1"
      - "test-everything.ps1"
      - "docker-compose.yml"
      - ".github/workflows/integration-test.yml"
  workflow_dispatch: {}

jobs:
  integration:
    name: Full booking + AI chat flow (docker compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env for docker compose
        run: |
          cat > .env <<EOF
          DB_NAME=fixitpro
          DB_USER=fixitpro_user
          DB_PASSWORD=ci_test_password
          MYSQL_ROOT_PASSWORD=ci_test_root_password
          JWT_SECRET=ci-ephemeral-secret-this-container-is-destroyed-at-end-of-run
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          # The test script does many legitimate sequential logins (admin,
          # customer, password-change verification, etc.) from the runner's
          # single IP - that's expected test behavior, not an attack, so CI
          # gets a much higher ceiling than production's real default (5/min).
          # Production itself is untouched - this only applies inside this
          # ephemeral CI stack.
          AUTH_RATE_LIMIT_CAPACITY=50
          CHAT_RATE_LIMIT_CAPACITY=50
          EOF

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for core-service to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "core-service is up"
              exit 0
            fi
            echo "waiting for core-service... ($i/60)"
            sleep 5
          done
          echo "core-service did not become healthy in time"
          docker compose logs core-service
          exit 1

      - name: Wait for ai-chat-service to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "ai-chat-service is up"
              exit 0
            fi
            echo "waiting for ai-chat-service... ($i/60)"
            sleep 5
          done
          echo "ai-chat-service did not become healthy in time"
          docker compose logs ai-chat-service
          exit 1

      - name: Run core booking flow
        run: pwsh -File ./test_fixitpro_flow.ps1 -AdminPassword "${{ secrets.TEST_ADMIN_PASSWORD }}"

      - name: Run AI chat flow
        run: pwsh -File ./test_ai_chat_flow.ps1

      # Broader smoke suite: flexible login (username/email/phone),
      # username availability, strict phone validation, password reset,
      # technician self-service, admin reservation management, and both
      # rate limiters. Overlaps with test_fixitpro_flow.ps1 in places (e.g.
      # health checks) but that's fine - CI's rate limit capacity (50) has
      # plenty of headroom, and this is the same script used as the local
      # pre-ship gate, so CI is now verifying the exact thing that gates a
      # local ship decision, not a parallel/divergent copy of it.
      - name: Run full smoke test suite
        run: pwsh -File ./test-everything.ps1 -AdminPassword "${{ secrets.TEST_ADMIN_PASSWORD }}"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v